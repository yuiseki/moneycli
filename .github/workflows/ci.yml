name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 went end of life on 2026-04-30. These are the lines that
        # are still supported, and the floor in package.json engines is 22.12,
        # where require() of an ES module landed.
        node: ['22.x', '24.x', '26.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Pack the published tarball
        run: |
          mkdir -p /tmp/pack
          npm pack --pack-destination /tmp/pack

      # Installed without hoisting, so the CLI can only resolve the
      # dependencies it declares itself. A module that happens to be pulled in
      # by vitest or by another dependency today is not available here.
      - name: Install the tarball with no hoisting
        run: |
          mkdir -p /tmp/smoke
          cd /tmp/smoke
          npm init -y
          npm install --omit=dev --install-strategy=nested /tmp/pack/*.tgz

      - name: The packed CLI runs on its declared dependencies alone
        run: |
          cd /tmp/smoke
          ./node_modules/.bin/money --help
          ./node_modules/.bin/moneycli --help

      # Provider resolution is the one thing that happens before any network
      # call or any cookie, so it is the part of the CLI a packed install can
      # be held to without an account.
      - name: The builtin provider resolves under that install
        run: |
          cd /tmp/smoke
          ./node_modules/.bin/money providers -j | tee providers.json
          grep -q '"money_forward"' providers.json

      # Reading a day back out of the cache exercises the date parsing, the
      # snapshot validation and the report formatter, none of which --help
      # reaches. A seeded 1970 day gives them one without an account.
      - name: A cached day formats under that install
        run: |
          cd /tmp/smoke
          mkdir -p /tmp/smoke/cache/1970/01/01/money_forward
          printf '%s' '{"version":1,"provider":"money_forward","dateKey":"1970-01-01","fetchedAt":"1970-01-01T00:00:00.000Z","data":{"kind":"money_forward","source":{"type":"money_forward_web"},"groups":[],"totals":{"assets":1234,"liabilities":34,"netWorth":1200,"asOfDate":"1970-01-01"}}}' \
            > /tmp/smoke/cache/1970/01/01/money_forward/data.json
          ./node_modules/.bin/money --date 1970-01-01 --cache-dir /tmp/smoke/cache | tee report.txt
          grep -q '1,234 JPY' report.txt
          grep -q '1,200 JPY' report.txt
          ./node_modules/.bin/money --date 1970-01-01 --cache-dir /tmp/smoke/cache -j | tee report.json
          grep -q '"fromCache": true' report.json

      # A day with nothing cached must fail rather than quietly print an empty
      # report, because a past date is cache-only by design.
      - name: A day with no cache fails
        run: |
          cd /tmp/smoke
          if ./node_modules/.bin/money --date 1970-01-02 --cache-dir /tmp/smoke/cache; then
            echo 'expected a missing cached day to fail'
            exit 1
          fi

      # The MCP server pulls in the largest dependency the CLI has, and it is
      # only reached through --mcp-server, so --help alone would not notice a
      # missing one. The handshake also proves the tool list, which is the
      # part a client configures against.
      - name: The MCP server answers a handshake under that install
        run: |
          cd /tmp/smoke
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"money_snapshot","arguments":{"date":"1970-01-01"}}}' \
            | MONEYCLI_CACHE_DIR=/tmp/smoke/cache timeout 30 ./node_modules/.bin/money --mcp-server > handshake.jsonl
          cat handshake.jsonl
          grep -q '"name":"moneycli"' handshake.jsonl
          grep -q '"money_days"' handshake.jsonl
          grep -q '"money_snapshot"' handshake.jsonl
          grep -q '"money_transactions"' handshake.jsonl
          grep -q '"money_breakdown"' handshake.jsonl
          grep -q '"money_history"' handshake.jsonl
          grep -q '"money_months"' handshake.jsonl
          grep -q '"money_cash_flow"' handshake.jsonl
          # The seeded 1970 day comes back through the tool, not just the CLI.
          grep -q '1200' handshake.jsonl

      # The server must not be able to reach Money Forward at all. If a fetch
      # ever creeps back in, this is where it shows up.
      - name: The MCP server declares itself read-only and closed-world
        run: |
          cd /tmp/smoke
          node -e "
            const fs = require('fs');
            const lines = fs.readFileSync('handshake.jsonl', 'utf8').trim().split('\n').map(JSON.parse);
            const tools = lines.find((m) => m.id === 2).result.tools;
            if (tools.length === 0) throw new Error('no tools listed');
            for (const tool of tools) {
              if (tool.annotations?.readOnlyHint !== true) throw new Error(tool.name + ' is not readOnly');
              if (tool.annotations?.openWorldHint !== false) throw new Error(tool.name + ' is not closed-world');
            }
            console.log(tools.length + ' tools, all read-only and closed-world');
          "
